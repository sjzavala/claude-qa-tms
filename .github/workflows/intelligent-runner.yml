name: Intelligent runner

# Reusable workflow. Maps a PR's diff to the Playwright specs that declare coverage of
# the changed files, runs only those, and comments the selection with its reasoning.
#
# Call it from a repo that has qa-tms-style traceability headers in its specs:
#
#   jobs:
#     tests:
#       uses: sjzavala/claude-qa-tms/.github/workflows/intelligent-runner.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#
# Selection never silently narrows: an unmapped source file or an infra change runs the
# full suite. See scripts/select-tests.mjs.

on:
  workflow_call:
    inputs:
      label:
        description: 'PR label that activates selection. Without it, the full suite runs.'
        type: string
        default: 'use-intelligent-runner'
      test-dir:
        description: 'Directory containing Playwright specs.'
        type: string
        default: 'tests'
      node-version:
        type: string
        default: '22'
      install-command:
        type: string
        default: 'npm ci'
      qa-tms-ref:
        description: 'Ref of sjzavala/claude-qa-tms to take the selection engine from.'
        type: string
        default: 'main'
      comment:
        description: 'Post the selection table as a PR comment.'
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo under test
        uses: actions/checkout@v7
        with:
          # Full history so the merge-base with the target branch is reachable.
          fetch-depth: 0

      - name: Check out the selection engine
        uses: actions/checkout@v7
        with:
          repository: sjzavala/claude-qa-tms
          ref: ${{ inputs.qa-tms-ref }}
          path: .qa-tms-engine

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Decide whether selection is active
        id: gate
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          WANTED: ${{ inputs.label }}
        run: |
          if echo "$LABELS" | grep -qF "\"$WANTED\""; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Label '$WANTED' present — selecting a subset."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Label '$WANTED' absent — running the full suite."
          fi

      - name: Collect changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diff against the merge base, not the base tip: otherwise every commit landed
          # on the target branch since the PR opened is reported as "changed here" and
          # selection escalates to the full suite for no reason.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only --diff-filter=d "$MERGE_BASE" "$HEAD_SHA" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

      - name: Select specs
        id: select
        if: steps.gate.outputs.active == 'true'
        run: |
          node .qa-tms-engine/scripts/select-tests.mjs \
            --test-dir "${{ inputs.test-dir }}" \
            --changed-file changed-files.txt \
            --out-json selection.json \
            --out-markdown selection.md

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        env:
          MODE: ${{ steps.select.outputs.mode }}
          SPEC_ARGS: ${{ steps.select.outputs.spec-args }}
          ACTIVE: ${{ steps.gate.outputs.active }}
        run: |
          if [ "$ACTIVE" != "true" ]; then
            echo "Running the full suite (selection not active)."
            npx playwright test
          elif [ "$MODE" = "subset" ] && [ -n "$SPEC_ARGS" ]; then
            echo "Running selected specs: $SPEC_ARGS"
            # Unquoted on purpose — the engine emits a space-separated list of paths.
            npx playwright test $SPEC_ARGS
          else
            echo "Running the full suite (selection escalated)."
            npx playwright test
          fi

      - name: Comment the selection
        # Runs even when tests fail — the reasoning is most useful on a red build.
        if: ${{ always() && inputs.comment && steps.gate.outputs.active == 'true' && github.event.pull_request.number }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ steps.tests.outcome }}
        run: |
          [ -f selection.md ] || exit 0
          {
            cat selection.md
            echo
            if [ "$RESULT" = "success" ]; then
              echo "**Result:** ✅ selected specs passed."
            else
              echo "**Result:** ❌ selected specs failed — see the run log and the uploaded report."
            fi
            echo
            echo "<sub>🤖 qa-tms intelligent runner · [\`select-tests.mjs\`](https://github.com/sjzavala/claude-qa-tms/blob/main/scripts/select-tests.mjs)</sub>"
          } > comment.md
          # Keep one rolling comment per PR instead of one per push.
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file comment.md

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload selection details
        if: ${{ always() && steps.gate.outputs.active == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-selection
          path: |
            selection.json
            selection.md
            changed-files.txt
          retention-days: 7
          if-no-files-found: ignore
